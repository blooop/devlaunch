[workspace]
resolver = "3"
members = ["devlaunch-core", "dl", "devlaunch-test-support"]

# The single source of the version (docs/rust-rewrite-plan.md: cutover ships
# 0.1.0, version read from Cargo.toml).
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/blooop/devlaunch"

[workspace.dependencies]
devlaunch-core = { path = "devlaunch-core" }
devlaunch-test-support = { path = "devlaunch-test-support" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
skim = "0.20"
fd-lock = "4"
shlex = "2"
tempfile = "3"
assert_cmd = "2"
portable-pty = "0.9"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
