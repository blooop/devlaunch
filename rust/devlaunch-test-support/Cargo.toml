[package]
name = "devlaunch-test-support"
description = "Dev-only test support for devlaunch: the fake runner, fixtures, scenario builders"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
devlaunch-runner = { workspace = true }
serde_json = { workspace = true }
# The content half of `cache_fingerprint`, and the same hash the retired
# `compare.py --fingerprint` took.
sha2 = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
# Only the conformance corpus reader needs derived deserialization, and it is a
# test module — so this stays out of the crate's own dependency set.
serde = { workspace = true }

[lints]
workspace = true
