# Written by `dl --herdr-setup`, which rewrites this file when devlaunch ships a
# new version of it. kitty.conf includes it with `include devlaunch-herdr.conf`.
#
# herdr turns on the kitty keyboard protocol, and under it kitty sends F2 and F4
# as bare `CSI Q` and `CSI S`. herdr's parser drops that form, so those keys
# never reach it. These lines send the SS3 form (`ESC O Q`, `ESC O S`) instead,
# which herdr parses. SS3 is also what kitty's own terminfo advertises, so
# programs in other kitty windows still see the keys.
#
# F3 is `CSI 13~` in both modes and needs no fix, but herdr also parses its SS3
# form, so it is sent the same way. F1 has the same problem and no line here,
# because the keymap `dl --herdr-setup` ships binds only shift+f1, which kitty
# sends as `CSI 1;2P` and herdr parses.
#
# Remove this file once herdr parses the bare form. `ctrl+space c/p/n` reach the
# same tab actions with no terminal help.
map f2 send_text all \x1bOQ
map f3 send_text all \x1bOR
map f4 send_text all \x1bOS
