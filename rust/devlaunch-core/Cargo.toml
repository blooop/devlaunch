[package]
name = "devlaunch-core"
description = "devlaunch's engine: every operation behind the dl CLI, as a typed library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
libc = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
toml = { workspace = true }
rustix = { workspace = true }
jiff = { workspace = true }
shlex = { workspace = true }
# Not dev-only: metadata's atomic save needs a same-directory 0600 temp file no
# other writer can be holding, which is what Python's tempfile.mkstemp gives it.
tempfile = { workspace = true }

[dev-dependencies]
devlaunch-test-support = { workspace = true }

[lints]
workspace = true
