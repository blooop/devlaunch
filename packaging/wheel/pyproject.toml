# The PyPI artifact: a wheel whose payload is the two compiled binaries.
#
# Why this is a second pyproject.toml rather than the repository's own. The root
# `pyproject.toml` is the pixi workspace and the tool configuration; since #267 it
# declares no `[project]` and no build backend at all, because there is no Python
# to build. A maturin backend there would make every `pixi install` -- every CI job
# and every container create -- a cargo build, for an artifact only the release
# path wants. So the root manifest builds nothing, and the artifact that goes to
# PyPI is built from here.
#
# Build it with:
#
#     cd packaging/wheel && maturin build --release -o dist
#
# and see `.github/workflows/publish.yml` for the release path.

[project]
name = "devlaunch"
# The version is not written here. maturin reads `package.version` of the cargo
# package below -- which inherits `[workspace.package] version` from
# `rust/Cargo.toml`, the one place the version lives. `dynamic` is also what stops
# maturin clearing the Cargo-sourced fields it fills in.
dynamic = ["version"]
description = "DevLaunch - A streamlined CLI for devpod workspaces"
# `README.md` here is a symlink to the repository's own `../../README.md`, and it
# has to be: maturin >=1.14 refuses a `readme` path that resolves outside the
# metadata root (this directory), so the literal `../../README.md` that worked
# through 1.13 fails the build. The symlink keeps the one canonical README as the
# PyPI long-description while giving maturin a path that stays inside the root.
readme = "README.md"
license = "MIT"
authors = [{ name = "Austin Gregg-Smith", email = "blooop@gmail.com" }]
# No dependencies, and no `requires-python`. The wheel carries two statically
# linked binaries; there is no Python in it to run and nothing to import. `dl`
# needs `devpod` and `git` on PATH, which no Python metadata can express -- the
# conda package is where those are declared (`conda.recipe/recipe.yaml`).
#
# `iterfzf` and `tomli` used to be here. The fuzzy selector is embedded skim now
# (docs/rust-rewrite-plan.md divergence row 6) and TOML parsing is in-process, so
# both are gone from the shipped artifact.

[project.urls]
Source = "https://github.com/blooop/devlaunch"
Home = "https://github.com/blooop/devlaunch"

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
bindings = "bin"
# The `dl` package owns both bin targets: its own `dl`, and an `aid` compiled from
# `rust/aid/src/main.rs` behind the `wheel` feature. See the comment on that
# feature in `rust/dl/Cargo.toml` for why it is arranged that way; the short of it
# is that a bin-wheel ships one cargo package's bins and this release ships two.
manifest-path = "../../rust/dl/Cargo.toml"
features = ["wheel"]
# No `[project.scripts]`: maturin refuses a bin-bindings project that defines any
# ("Defining scripts and working with a binary doesn't mix well"), and there is
# nothing to point one at. The wheel installs `dl` and `aid` as
# `devlaunch-<version>.data/scripts/`, which pip drops straight into the
# environment's `bin/` -- the binaries themselves, not Python wrappers around
# them.
