# This manifest is the *development* one, and since 0.1.0 it is no longer
# the one that is published.
#
# What ships is a linux-64 wheel of the two compiled binaries, built by maturin
# from `packaging/wheel/pyproject.toml` (and a conda package of the same two
# binaries from `conda.recipe/recipe.yaml`). What is here is the pixi workspace
# and the frozen Python build the parity harness still runs as the reference
# implementation: `test/fixtures/e2e_helpers.py` defaults `DEVLAUNCH_DL_CMD` to
# `python -m devlaunch.dl`, most of `test/` imports `devlaunch.*` directly, and
# `.devcontainer/devcontainer.json`'s `postCreateCommand` is a bare `pixi install`.
# So hatchling and the editable self-install below stay exactly as they were; they
# serve the suite, not the release. The `rust` feature further down does put a
# toolchain in that environment, but nothing here is built with it: it is for
# building the crates under `rust/` from inside a container, and what ships is
# still built by maturin and cargo from the manifests named above.
[project]
name = "devlaunch"
# Read, not written -- from `rust/Cargo.toml`'s `[workspace.package] version`, the
# one place the version lives (docs/rust-rewrite-plan.md M10). The published
# wheel's metadata and the conda recipe read the same file; a release is one edit.
dynamic = ["version"]
authors = [{ name = "Austin Gregg-Smith", email = "blooop@gmail.com" }]
description = "DevLaunch - A streamlined CLI for devpod workspaces"
readme = "README.md"
license = "MIT"

# The frozen Python build's imports. Neither is a dependency of the shipped
# artifact any more: the selector is embedded skim (docs/rust-rewrite-plan.md
# divergence row 6) and TOML is parsed in-process, so `packaging/wheel` and the
# conda recipe declare neither.
dependencies = [
  "iterfzf>=1.0.0",
  "tomli>=2.0.0",
]

[project.urls]
Source = "https://github.com/blooop/devlaunch"
Home = "https://github.com/blooop/devlaunch"

[tool.pixi.workspace]
channels = ["conda-forge", "https://prefix.dev/blooop"]
# linux-aarch64 is here for the *development* environment, and claims nothing
# about the release: what ships is still a linux-64 wheel and a linux-64 conda
# package, as the header above says.
#
# It is required rather than nice to have, because a pixi workspace refuses
# outright on a platform it does not declare. Measured on a throwaway workspace
# declaring one platform this machine cannot run: `pixi install` exits
# `unsupported-platform`, "The workspace does not support '<platform>' on this
# machine", and installs nothing. That is two arm64 paths that cannot work
# without the line below: the arm64 leg of
# `.github/workflows/devcontainer-prebuild.yml`, which fails at `setup-pixi`
# before it can build an image, and this repository's own devcontainer on an
# Apple Silicon host, whose `postCreateCommand` is a bare `pixi install` and so
# fails at container create -- which would make an arm64 prebuild an image that
# pulls fast and then cannot come up.
#
# What it costs is +825 lines of pixi.lock and no linux-64 pin: the two solves
# are independent, and every dependency resolves to a real aarch64 build --
# devpod 0.26.1 is in the blooop channel for linux-aarch64, which is the one
# that matters here, since the prebuild tag is only usable if the devpod that
# publishes it is the devpod that later looks for it.
platforms = ["linux-64", "linux-aarch64"]

[tool.pixi.dependencies]
python = ">=3.10"
shellcheck = ">=0.10.0,<0.11"
# Match the devpod `dl` is actually installed alongside (pixi global ships
# 0.26.x). The pin used to be <0.9, which quietly meant the suite exercised a
# devpod five years of releases behind the one users run -- and it hid this
# module's bug outright: 0.8 requests a pty for `devpod ssh --command` whenever
# stdout is a terminal, and 0.26 never does. See devlaunch/tty_session.py.
devpod = ">=0.26.1,<0.27"
gh = ">=2.83.0,<3.0"

# Conda-side tools the suite needs, alongside the `test` feature's PyPI half in
# [project.optional-dependencies]. git-lfs is not a devlaunch runtime dependency
# -- `dl` treats it as optional and skips LFS work when it is absent -- but the
# tests that pin the cache-as-LFS-store behaviour need the real thing, and would
# otherwise *skip*, which is the failure mode that looks like a pass.
[tool.pixi.feature.test.dependencies]
git-lfs = ">=3.4,<4"

# The toolchain that builds what ships, in the environment the devcontainer
# installs -- so `pixi run cargo test` works the moment a container comes up and
# an agent working in one can compile the thing it is editing. Before this, the
# container had no cargo at all: a Rust change could be written in here and not
# built, and the only verification available was pushing it and reading CI.
#
# `rust/rust-toolchain.toml` stays the pin of record; this and `ci.yml`'s two
# `dtolnay/rust-toolchain` steps are kept in lockstep with it by hand, the same
# arrangement those two steps already had. A conda `rust` does not read
# `rust-toolchain.toml` -- that file is rustup's -- so the version has to be said
# again here rather than derived from it.
#
# A feature on `default` alone, not a plain dependency: `py310`-`py313` exist to
# run the frozen Python reference against four interpreters and have no use for
# cargo, and a plain dependency would put the toolchain in each of their solves
# and CI caches. It is not free where it does go -- the environment goes from
# 521MB to 2044MB, since conda's `rust` links with a gcc toolchain, a sysroot and
# binutils -- and README's "Disk cost of the dev container" carries the numbers
# and the reason that trade is the right one.
[tool.pixi.feature.rust.dependencies]
# `1.97.1.*`, not `1.97.*`: `rust/rust-toolchain.toml` names 1.97.1 and `ci.yml`
# installs 1.97.1, and AGENTS.md already tells a reader this environment is "pinned
# to the 1.97.1 that rust-toolchain.toml names". At `1.97.*` that stops being true
# the day 1.97.2 is published -- silently, and only inside the container, which is
# the worst place for a toolchain difference to appear. Kept in lockstep by
# `test_agents_doc.py`.
rust = "1.97.1.*"

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"
[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.pypi-dependencies]
devlaunch = { path = ".", editable = true }

[project.optional-dependencies]
test = [
  "pylint>=3.2.5,<=4.0.5",
  "pytest-cov>=4.1,<=7.1.0",
  "pytest>=7.4,<=9.0.3",
  "hypothesis>=6.104.2,<=6.155.1",
  "ruff>=0.5.0,<=0.15.15",
  "coverage>=7.5.4,<=7.14.1",
  "prek>=0.2.28,<0.5.0",
  "ty>=0.0.12,<=0.0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `dynamic = ["version"]` above, resolved here: hatchling's regex source, pointed
# at the cargo manifest. The first `version = "..."` line in `rust/Cargo.toml` is
# `[workspace.package]`'s, which every crate inherits with `version.workspace =
# true` -- so the frozen Python build in this environment reports the same version
# the binaries do, without a second number to keep in step.
[tool.hatch.version]
path = "rust/Cargo.toml"
pattern = '(?m)^version = "(?P<version>[^"]+)"'

[tool.hatch.build]
include = ["devlaunch"]

[project.scripts]
dl = "devlaunch.dl:main"
aid = "devlaunch.aid:main"

# Environments
[tool.pixi.environments]
default = { features = ["test", "rust"], solve-group = "default" }
py310 = ["py310", "test"]
py311 = ["py311", "test"]
py312 = ["py312", "test"]
py313 = ["py313", "test"]

[tool.pixi.tasks]
# `pixi run dl` and `pixi run aid`: this working tree, compiled and run (#268).
#
# Tasks now, where they used to be console scripts the editable Python install put
# in the environment. Nothing resolves `dl` in here by accident any more, which is
# the point -- the shipped implementation is Rust, and these are the only two names
# in the container that name it.
#
# `cargo run` rather than a build task and a path, so there is still no build step
# to remember: it compiles what changed and runs the result. The debug profile,
# because this is the edit-run loop and a release build pays two-figure seconds for
# a startup difference nothing in here measures (`pixi run bench` and `./dev.sh`
# are where the release profile matters). `-q` so cargo's progress lines stay out
# of stdout, which callers of `--ls --json` parse.
#
# `--features .../dev-build` marks the version line `-dev`, exactly as `./dev.sh`
# does on the host: a build of somebody's tree says so wherever it runs.
dl = "cargo run -q --locked --manifest-path rust/Cargo.toml -p dl --bin dl --features dl/dev-build --"
aid = "cargo run -q --locked --manifest-path rust/Cargo.toml -p aid --bin aid --features aid/dev-build --"
dev-add-docker = "python -m devlaunch.devpod_provider docker"
dev = { cmd = "devpod up . --ide none && ssh pythontemplate.devpod", depends-on = ["dev-add-docker"] }
dev-vs = { cmd = "devpod up . --ide vscode", depends-on = ["dev-add-docker"] }
dev-restart = { cmd = "devpod up . --recreate --ide none && ssh pythontemplate.devpod", depends-on = ["dev-add-docker"] }
dev-restart-vs = { cmd = "devpod up . --recreate --ide vscode", depends-on = ["dev-add-docker"] }
# Build this repo's devcontainer and publish it to the prebuild repository named
# in .devcontainer/devcontainer.json (customizations.devpod.prebuildRepository),
# so that the next `dl blooop/devlaunch` pulls an image instead of building one.
#
# No `--repository`: devpod reads the destination out of devcontainer.json, which
# keeps the registry written down in exactly one place. The tag devpod publishes
# on its own is the prebuild hash -- which is per architecture, since the
# architecture is hashed with the config and the context -- and `--tag` adds a
# moving alias next to it, the one `build.cacheFrom` points at for builders that
# do not understand prebuilds (VS Code, plain `devcontainer up`).
#
# The alias is an argument, defaulting to `latest`, because two architectures now
# publish into one repository and devpod arch-qualifies nothing: an alias passed
# by both legs is a tag whose owner is whichever leg finished last. So `latest`
# is amd64's and `latest-arm64` is arm64's; see the comment on the build step in
# the workflow for why that asymmetry is the right one. Publishing by hand needs
# no argument and behaves exactly as it did.
#
# `.github/workflows/devcontainer-prebuild.yml` runs this on pushes to `main`
# that touch `.devcontainer/**`; it is a task so the same command can be run by
# hand -- after `docker login ghcr.io` -- to publish from a branch. Idempotent
# either way: an existing prebuild is found and returned, not rebuilt.
devcontainer-prebuild = { cmd = "devpod build . --tag {{ alias }}", args = [{ arg = "alias", default = "latest" }], depends-on = ["dev-add-docker"] }
prek = "prek run -a"
prek-update = "prek autoupdate"
format = "ruff format ."
check-clean-workspace = "git diff --exit-code"
ruff-lint = "ruff check . --fix"
pylint = "pylint --version && echo 'running pylint...' && pylint $(git ls-files '*.py')"
ty = "ty check --respect-ignore-files ."
lint = { depends-on = ["ruff-lint", "ty", "pylint"] }
style = { depends-on = ["format", "lint"] }
commit-format = "git commit -a -m'autoformat code' || true"
test = "pytest"
# Median wall time of a command over N runs; see "Measuring launch time" in README.md.
bench = "python scripts/bench_launch.py"
# The step between a bench record and the published trend: see "The trend on
# main" in README.md. The bench workflow runs it; it is a task so that the same
# command can be run by hand against records a developer benched themselves.
bench-points = "python scripts/bench_points.py"
# Needs a real Docker daemon and a real devpod. Inside this repo's devcontainer
# that daemon is the container's own, via the docker-in-docker feature; on an
# ephemeral CI runner or a machine you do not mind writing to, it is the host's.
#
# The default run excludes e2e (see addopts); this is the way back in. A
# trailing `-m e2e` beats the one in addopts, and `-ra` puts every skip's reason
# in the summary, which is the whole difference between a run that opted out of
# something and a run that could not do it.
#
# Deliberately no `depends-on = ["dev-add-docker"]`. The suite repoints
# DEVPOD_HOME at a fresh directory in pytest_configure, before collection, so a
# provider registered in the ambient ~/.devpod is one this run never reads:
# test/e2e/conftest.py installs it into the run's own home instead. An edge here
# would buy the suite nothing and write to the developer's real devpod home as a
# side effect of running tests.
test-e2e = "pytest -m e2e -ra test/e2e/"
coverage = "coverage run -m pytest && coverage xml -o coverage.xml"
coverage-report = "coverage report -m"
update-lock = "pixi update && git commit -a -m'update pixi.lock' || true"
push = "git push"
update-lock-push = { depends-on = ["update-lock", "push"] }
fix = { depends-on = ["update-lock", "format", "ruff-lint", "prek"] }
fix-commit-push = { depends-on = ["fix", "commit-format", "update-lock-push"] }
ci-no-cover = { depends-on = ["style", "test"] }
ci = { depends-on = [
  "format",
  "ruff-lint",
  "pylint",
  "ty",
  "coverage",
  "coverage-report",
] }
ci-push = { depends-on = ["format", "ruff-lint", "update-lock", "ci", "push"] }
clear-pixi = "rm -rf .pixi pixi.lock"
setup-git-merge-driver = "git config merge.ourslock.driver true"
update-from-template-repo = "./scripts/update_from_template.sh"

[tool.pylint]
extension-pkg-whitelist = ["numpy"]
jobs = 16                           #detect number of cores

[tool.pylint.'MESSAGES CONTROL']
disable = "C,logging-fstring-interpolation,line-too-long,fixme,broad-exception-caught,missing-module-docstring,too-many-instance-attributes,too-few-public-methods,too-many-arguments,too-many-positional-arguments,too-many-locals,too-many-branches,too-many-statements,too-many-return-statements,use-dict-literal,cyclic-import,duplicate-code,too-many-public-methods"
enable = "no-else-return,consider-using-in"

[tool.pytest.ini_options]
markers = [
    "unit: Pure logic tests with no external commands. Fast, runs everywhere.",
    "integration: Real git commands, mocked DevPod. Catches git errors and path issues.",
    "e2e: Real DevPod creating real containers. Needs a Docker daemon.",
    "creates_workspace: This e2e test builds a real workspace. The session floor in test/e2e/conftest.py holds a run that attempted one of these and built nothing to be a failure, so the promise is declared by the test rather than inferred afterwards.",
]
testpaths = ["test"]
# Default: run unit and integration tests, skip e2e (which needs a daemon, and
# creates and deletes real containers -- in a devpod home the suite makes for
# the run, never the developer's)
addopts = "-m 'not e2e'"

[tool.coverage.run]
omit = ["*/test/*", "__init__.py"]

[tool.coverage.report]
exclude_also = [
  "def __repr__",
  "if False:",
  "if 0:",
  "raise AssertionError",
  "raise NotImplementedError",
  # The exhaustiveness sentinel. `ty` runs in CI and rejects any call to it that
  # is reachable, so in a build that type-checks these lines cannot be executed
  # -- the same reason `raise AssertionError` is already on this list.
  "_unhandled_default_branch\\(",
  "_unhandled_removal\\(",
  "_unhandled_source\\(",
  "_unhandled_status\\(",
  "_unhandled_usage\\(",
  "if __name__ == .__main__.:",
  "pass",
  "(_):",
]
