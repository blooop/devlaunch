name: Auto-publish

on:
  push:
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if the version tag already exists'
        required: false
        default: false
        type: boolean

jobs:
  # Decide once whether this commit introduces a new version, so the PyPI and
  # conda jobs below stay in lockstep.
  check-version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Check whether the version was bumped
        id: check
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" = "true" ] || ! git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing version ${version}"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${version} already exists, nothing to publish"
          fi

  pypi-publish:
    name: Publish to PyPI
    needs: check-version
    if: needs.check-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:  # Don't forget permissions
      contents: write
    steps:
      - uses: etils-actions/pypi-auto-publish@v1
        with:
          pypi-token: ${{ secrets.PYPI_API_TOKEN }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          parse-changelog: true

  conda-build:
    name: Build conda package
    needs: check-version
    if: needs.check-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build conda package
        uses: prefix-dev/rattler-build-action@v0.2.38
        with:
          recipe-path: conda.recipe/recipe.yaml
          # --experimental enables load_from_file(), used to read the version from pyproject.toml
          build-args: --experimental --channel conda-forge --channel https://prefix.dev/blooop --no-include-recipe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: conda-packages
          path: output/
          if-no-files-found: error

  conda-publish:
    name: Publish to prefix.dev
    needs: conda-build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: conda-packages
          path: output/

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          run-install: false

      - name: Upload to prefix.dev
        env:
          PIXI_TOKEN: ${{ secrets.PIXI_TOKEN }}
        run: |
          for pkg in $(find output -type f \( -name "*.conda" -o -name "*.tar.bz2" \)); do
            echo "Uploading ${pkg}"
            if pixi exec rattler-build upload prefix \
              -c blooop \
              --api-key "$PIXI_TOKEN" \
              "${pkg}"; then
              echo "Successfully uploaded ${pkg}"
            else
              echo "Failed to upload ${pkg} (may already exist)"
            fi
          done
